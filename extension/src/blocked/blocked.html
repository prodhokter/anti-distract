<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diblokir — AntiDistract</title>
<link rel="stylesheet" href="blocked.css">
</head>
<body>

<div class="container">
  <div class="icon">🚫</div>
  <h1>Situs Diblokir</h1>
  <div class="url" id="site-url"></div>
  <div class="quote" id="quote"></div>
  <p class="message">Focus Mode sedang aktif. Situs ini ada di daftar blokirmu. Tetap fokus — setiap sesi yang kamu selesaikan akan menumbuhkan taman virtualmu.</p>

  <div class="timer-section" id="timer-section" style="display:none">
    <div class="timer-label">Blokir berakhir dalam</div>
    <div class="countdown" id="countdown">--:--</div>
  </div>

  <button class="btn-back" onclick="window.close()">Tutup Tab</button>

  <div class="streak-info" id="streak-info"></div>
</div>

<script src="blocked.js"></script>
</body>
</html>
