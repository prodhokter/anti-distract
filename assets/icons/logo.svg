<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0f0ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)"/>

  <!-- Shield shape -->
  <path d="M256 80 C256 80 140 140 140 220 C140 340 200 410 256 440 C312 410 372 340 372 220 C372 140 256 80 256 80 Z"
        fill="url(#shield-grad)" stroke="#6c63ff" stroke-width="3"/>

  <!-- Inner shield border -->
  <path d="M256 105 C256 105 160 158 160 225 C160 330 210 392 256 418 C302 392 352 330 352 225 C352 158 256 105 256 105 Z"
        fill="none" stroke="#6c63ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- "A" letter -->
  <text x="195" y="290" font-family="'Segoe UI', 'Inter', sans-serif" font-size="140" font-weight="900"
        fill="#6c63ff" letter-spacing="-8">A</text>

  <!-- "D" letter -->
  <text x="250" y="350" font-family="'Segoe UI', 'Inter', sans-serif" font-size="128" font-weight="900"
        fill="#ff6b9d" letter-spacing="-4">D</text>

  <!-- Focus dot -->
  <circle cx="320" cy="180" r="10" fill="#6c63ff" opacity="0.6"/>
  <circle cx="320" cy="180" r="4" fill="#ff6b9d"/>
</svg>
